# https://setuptools.pypa.io/en/latest/userguide/quickstart.html
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
fail-under = 100
exclude = ["setup.py", "docs", "build", "examples"]
ignore-regex = ["^get$", "^mock_.*", ".*BaseClass.*"]
verbose = 2
quiet = false
whitelist-regex = []
color = true

[tool.pytest.ini_options]
addopts = "-v --cov --cov-report term-missing"
testpaths = [
    "tests",
]

[tool.ruff]
# Ruff is the single linter + formatter + import-sorter (replaces black,
# isort, flake8, and pylint). See https://docs.astral.sh/ruff/rules/ for
# rules and https://docs.astral.sh/ruff/configuration/ for configuration.
line-length = 88

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes; I = isort import sorting.
select = ["E", "F", "I"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
namespaces = false

[project]
name = "negative_ml"
version = "0.0.1"
dependencies = [
    "matplotlib",
    "pandas",
    "scikit-learn",
    "numpy",
    "xgboost",
    "typer",
]
readme = "README.md"

[project.optional-dependencies]
molecules = [
    "rdkit",
]
baseball = [
    "pybaseball",
]
tests = [
    "pytest"
]
docs = [
    "mkdocs-material",
    "mkdocs"
]

[project.scripts]
negative_ml = "negative_ml.cli:app"


[tool.coverage.run]
omit = [
    "tests/*",
]
