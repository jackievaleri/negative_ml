name: negative_ml
channels:
- conda-forge
dependencies:
# Core stack
- python>=3.11
- python-build
- bump2version
- ipykernel
- ipywidgets
- jupyter
- jupyterlab
- pip
- twine
# Standard PyData stack
- matplotlib
- numpy
- pandas
- pyarrow
- rdkit
- scikit-learn
- scipy
- seaborn
- xgboost
# Utilities
- pyprojroot
- python-dotenv
# CLI development
- typer
- typer-cli
# Software testing
- hypothesis
- pytest
- pytest-cov
- coverage
# Code Style Tools
- black
- darglint
- flake8
- interrogate
- pre-commit
- pylint
# pip dependencies
- pip:
  # Place packages that cannot be installed by conda in this section.
  - pybaseball
