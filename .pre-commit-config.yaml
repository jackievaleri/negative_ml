repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args: [-c, pyproject.toml]
        # interrogate 1.5.0 imports pkg_resources, which setuptools removed in
        # v81. Pin setuptools below that so the hook env keeps pkg_resources.
        additional_dependencies: ["setuptools<81"]
  - repo: https://github.com/jsh9/pydoclint
    rev: 0.8.7
    hooks:
      - id: pydoclint
        args:
          - "--config=pyproject.toml"
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.19
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --exclude, nbconvert_config.py]
      - id: ruff-format
        args: [--exclude, nbconvert_config.py]
